<svg width="720" height="1440" viewBox="0 0 720 1440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Predibol app preview">
  <defs>
    <linearGradient id="g1" x1="80" y1="80" x2="640" y2="1360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-40" y="-40" width="800" height="1600" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#10B981" flood-opacity="0.16"/>
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Device -->
  <g filter="url(#shadow)">
    <rect x="80" y="80" width="560" height="1280" rx="92" fill="#0B1220" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="4"/>
    <rect x="104" y="124" width="512" height="1192" rx="74" fill="url(#g1)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  </g>

  <!-- Status / top bar -->
  <rect x="254" y="136" width="212" height="34" rx="17" fill="#000000" fill-opacity="0.35"/>
  <text x="140" y="176" fill="#E2E8F0" fill-opacity="0.75" font-family="ui-sans-serif, system-ui" font-size="26" font-weight="700">Predibol</text>

  <!-- Hero card -->
  <g>
    <rect x="140" y="248" width="440" height="212" rx="30" fill="#0F172A" fill-opacity="0.70" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
    <text x="168" y="308" fill="#F8FAFC" font-family="ui-sans-serif, system-ui" font-size="34" font-weight="800">Predice el Mundial</text>
    <text x="168" y="352" fill="#F8FAFC" font-family="ui-sans-serif, system-ui" font-size="34" font-weight="800">con tus amigos</text>
    <text x="168" y="398" fill="#94A3B8" font-family="ui-sans-serif, system-ui" font-size="22" font-weight="600">Crea tu grupo · Mete tus pronósticos</text>
  </g>

  <!-- Countdown -->
  <g>
    <rect x="140" y="488" width="440" height="86" rx="22" fill="#0B1220" fill-opacity="0.65" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
    <text x="168" y="538" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="800">36d · 08h · 46m · 44s</text>
    <text x="168" y="566" fill="#64748B" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="600">para el primer partido ½</text>
  </g>

  <!-- CTA -->
  <g>
    <rect x="140" y="612" width="440" height="92" rx="28" fill="url(#cta)"/>
    <text x="360" y="669" text-anchor="middle" fill="#FFFFFF" font-family="ui-sans-serif, system-ui" font-size="28" font-weight="900">Crear mi grupo gratis ’</text>
    <text x="360" y="695" text-anchor="middle" fill="#D1FAE5" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="700">Sin tarjeta de crédito</text>
  </g>

  <!-- List cards -->
  <g>
    <rect x="140" y="742" width="440" height="126" rx="26" fill="#0F172A" fill-opacity="0.60" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
    <text x="168" y="794" fill="#E2E8F0" font-family="ui-sans-serif, system-ui" font-size="22" font-weight="800"><Æ Ranking en vivo</text>
    <text x="168" y="830" fill="#94A3B8" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="600">Puntos, rachas y rival IA</text>

    <rect x="140" y="888" width="440" height="126" rx="26" fill="#0F172A" fill-opacity="0.60" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
    <text x="168" y="940" fill="#E2E8F0" font-family="ui-sans-serif, system-ui" font-size="22" font-weight="800">¡ Superpowers</text>
    <text x="168" y="976" fill="#94A3B8" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="600">Double Down · Spy · Shield</text>

    <rect x="140" y="1034" width="440" height="126" rx="26" fill="#0F172A" fill-opacity="0.60" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
    <text x="168" y="1086" fill="#E2E8F0" font-family="ui-sans-serif, system-ui" font-size="22" font-weight="800"><´ Álbum de stickers</text>
    <text x="168" y="1122" fill="#94A3B8" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="600">Completa las 48 selecciones</text>
  </g>
</svg>
